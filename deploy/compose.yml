# touchgrass on the homelab mini PC: static files served by nginx, published by cloudflared.
# Bound to localhost only; the tunnel ingress is touchgrass.davideghiotto.it -> http://localhost:8796.
name: touchgrass

services:
  web:
    image: nginx:1.30.6-alpine
    container_name: touchgrass-web
    restart: unless-stopped
    # The box's Docker address pools are exhausted ("all predefined address pools have been fully
    # subnetted"), and this container talks to nobody: the default bridge needs no new subnet.
    network_mode: bridge
    ports:
      - "127.0.0.1:8796:80"
    volumes:
      - ./site:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /run
      - /tmp
    security_opt:
      - no-new-privileges:true
    mem_limit: 96m
    cpus: 1.0
    healthcheck:
      # 127.0.0.1, not localhost: busybox wget tries ::1 first and this config has no IPv6 listener.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
